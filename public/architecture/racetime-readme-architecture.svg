<text x="40" y="101" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#203646">From a race question to evidence you can review</text>
<text x="40" y="141" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526976">Python application • bounded model calls • persistent jobs and human review</text>
