<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150" role="img" aria-labelledby="title desc">
<title id="title">RaceTime Copilot architecture overview</title><desc id="desc">Video sources enter a Streamlit account-scoped job queue. A worker runs a bounded LangGraph agent that retrieves evidence, optionally inspects video with Gemini and generates a checked recap. SQLite persists jobs, observations and review checkpoints. Local traces and optional LangSmith support inspection; the TypeScript evidence demo and LoRA training lab are separate.</desc>
<rect width="1440" height="1150" rx="24" fill="#f5f3eb"/>
