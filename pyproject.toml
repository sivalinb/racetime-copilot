[tool.ruff]
required-version = "==0.16.7"
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi", "pyproject.toml"]
extend-exclude = ["node_modules", ".runtime", ".wrangler", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

