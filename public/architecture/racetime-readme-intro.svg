<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="670" viewBox="0 0 1440 670" role="img" aria-labelledby="title desc">
<title id="title">RaceTime Copilot at a glance</title><desc id="desc">A long race broadcast continues while a fan steps away. The fan chooses an available interval and spoiler cutoff, then reviews a recap with timestamped evidence. Screens are illustrative.</desc>
<rect width="1440" height="670" rx="24" fill="#f5f3eb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6a8790"/></marker></defs>
<text x="40" y="48" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#187b70">RACETIME COPILOT  /  THE PRODUCT</text>
<text x="40" y="104" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#203646">The race keeps going. Catch up when you can.</text>
<text x="40" y="145" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526976">For race fans, crews and organizers who need the story behind a missed interval.</text>
<rect x="40" y="185" width="400" height="370" rx="18" fill="#ffffff" stroke="none"/>
<rect x="520" y="185" width="400" height="370" rx="18" fill="#ffffff" stroke="none"/>
<rect x="1000" y="185" width="400" height="370" rx="18" fill="#ffffff" stroke="none"/>
<path d="M458 364 H500" stroke="#6a8790" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M938 364 H980" stroke="#6a8790" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="80" cy="222" r="18" fill="#187b70" stroke="none" stroke-width="2"/>
<text x="73" y="230" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#ffffff">1</text>
<text x="112" y="230" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#203646">Step away</text>
<circle cx="560" cy="222" r="18" fill="#187b70" stroke="none" stroke-width="2"/>
<text x="553" y="230" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#ffffff">2</text>
<text x="592" y="230" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#203646">Choose an interval</text>
<circle cx="1040" cy="222" r="18" fill="#187b70" stroke="none" stroke-width="2"/>
<text x="1033" y="230" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#ffffff">3</text>
<text x="1072" y="230" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#203646">Review the recap</text>
<rect x="70" y="262" width="340" height="190" rx="12" fill="#dceaf0" stroke="none"/>
<path d="M75 406 L149 307 L213 374 L283 289 L405 419 Z" stroke="none" stroke-width="0" fill="#83afa9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M75 428 L154 354 L209 411 L301 344 L405 428 Z" stroke="none" stroke-width="0" fill="#386c72" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M129 439 C265 436 189 395 302 369" stroke="#f7df9b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="118" cy="299" r="16" fill="#efc879" stroke="none" stroke-width="2"/>
<rect x="267" y="274" width="128" height="32" rx="9" fill="#203646" stroke="none"/>
<text x="280" y="298" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#ffffff">24h+ races</text>
<circle cx="355" cy="417" r="33" fill="#ffffff" stroke="#187b70" stroke-width="3"/>
<path d="M355 394 V417 L369 428" stroke="#187b70" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="490" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#203646">Sleep, work, life.</text>
<text x="70" y="527" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#526976">The broadcast carries on.</text>
<rect x="550" y="262" width="340" height="190" rx="12" fill="#eaf0f5" stroke="none"/>
<text x="568" y="298" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#396f9a">YouTube link or video</text>
<rect x="568" y="317" width="303" height="45" rx="8" fill="#ffffff" stroke="none"/>
<text x="585" y="347" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#203646">10:00 → 15:00</text>
<path d="M575 394 H865" stroke="#becbd2" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M643 394 H727" stroke="#187b70" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="643" cy="394" r="9" fill="#187b70" stroke="none" stroke-width="2"/>
<circle cx="727" cy="394" r="9" fill="#187b70" stroke="none" stroke-width="2"/>
<path d="M745 379 V409" stroke="#a66b27" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="568" y="437" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#a66b27">Spoiler cutoff  15:00</text>
<text x="550" y="490" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#203646">Ask what you missed.</text>
<text x="550" y="527" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#526976">Set the time boundaries.</text>
<rect x="1030" y="262" width="340" height="190" rx="12" fill="#e6f1ea" stroke="none"/>
<rect x="1047" y="282" width="305" height="60" rx="8" fill="#ffffff" stroke="none"/>
<path d="M1063 299 L1077 312 L1063 325 Z" stroke="#187b70" stroke-width="1" fill="#187b70" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1090" y="309" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#187b70">12:40  ·  Evidence</text>
<text x="1090" y="330" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#526976">Open the source moment</text>
<rect x="1047" y="355" width="305" height="60" rx="8" fill="#ffffff" stroke="none"/>
<path d="M1063 372 L1077 385 L1063 398 Z" stroke="#187b70" stroke-width="1" fill="#187b70" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1090" y="382" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#187b70">14:10  ·  Evidence</text>
<text x="1090" y="403" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#526976">Open the source moment</text>
<text x="1030" y="490" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#203646">Read. Watch. Decide.</text>
<text x="1030" y="527" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#526976">Approve or reject after review.</text>
<text x="40" y="602" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#187b70">Recap + timestamps + visible gaps + human review</text>
<text x="40" y="640" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#526976">Illustrative screens. Live questions require captured coverage; uncaptured past footage is unavailable.</text>
</svg>